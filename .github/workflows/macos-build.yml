name: macOS build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: build macos-${{ matrix.target }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            architecture: x86_64
          - target: arm64
            architecture: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install

      # Use the same explicit Bun targets as the release workflow.
      - name: Build macOS binary
        working-directory: packages/cli
        run: |
          mkdir -p binaries
          bun run build:macos-${{ matrix.target }}

      - name: Verify binary architecture
        run: test "$(lipo -archs packages/cli/binaries/viwo-macos-${{ matrix.target }})" = "${{ matrix.architecture }}"

      - name: Smoke-test native ARM64 binary
        if: matrix.target == 'arm64'
        env:
          NODE_ENV: test
        run: packages/cli/binaries/viwo-macos-arm64 --version
